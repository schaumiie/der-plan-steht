<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countdown</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #000000;
      --neon: #b70000;

      --glow-1: 0 0 6px rgba(183, 0, 0, 0.70);
      --glow-2: 0 0 18px rgba(183, 0, 0, 0.60);
      --glow-3: 0 0 42px rgba(183, 0, 0, 0.45);
      --glow-4: 0 0 90px rgba(255, 40, 40, 0.25);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--neon);
      font-family: "Teko", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
    }

    .panel {
      width: min(980px, 92vw);
      text-align: center;
      position: relative;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: -120px;
      background:
        radial-gradient(circle at 50% 40%, rgba(183,0,0,0.18), transparent 55%),
        radial-gradient(circle at 20% 70%, rgba(255,40,40,0.10), transparent 60%),
        radial-gradient(circle at 80% 75%, rgba(183,0,0,0.10), transparent 60%);
      filter: blur(10px);
      opacity: 0.9;
      pointer-events: none;
      z-index: 0;
    }

    .content { position: relative; z-index: 1; }

    .headline {
      margin: 0 0 18px 0;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: clamp(18px, 2.8vw, 30px);
    }

    .line {
      height: 2px;
      width: 100%;
      background: var(--neon);
      margin: 18px 0;
      transform-origin: center;
    }

    /* Grundzustand Neon (ohne Flackern) */
    .neon {
      text-shadow: var(--glow-1), var(--glow-2), var(--glow-3), var(--glow-4);
      filter: brightness(1);
      opacity: 1;
      transition: filter 70ms linear, opacity 70ms linear, text-shadow 70ms linear, transform 70ms linear;
    }

    /* Timer: immer zweizeilig, stabil auf Mobile */
    .timer {
      margin: 0;
      letter-spacing: 0.10em;
      font-weight: 700;
    }

    .timer .days {
      display: block;
      white-space: nowrap;
      font-size: clamp(28px, 4.5vw, 52px);
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1, "lnum" 1;
    }

    .timer .hms {
      display: block;
      white-space: nowrap;
      font-size: clamp(44px, 7vw, 98px);
      line-height: 1.0;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1, "lnum" 1;
    }

    .sub {
      margin: 14px 0 0 0;
      font-size: clamp(14px, 2.2vw, 18px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* Realistischere Flicker-States (werden per JS unregelmäßig gesetzt) */
    .flicker-dim {
      opacity: 0.82;
      filter: brightness(0.9);
      text-shadow: 0 0 3px rgba(183,0,0,0.45), 0 0 10px rgba(183,0,0,0.35), 0 0 22px rgba(183,0,0,0.22);
    }

    .flicker-pop {
      opacity: 1;
      filter: brightness(1.25);
      text-shadow:
        0 0 8px rgba(255,40,40,0.85),
        0 0 22px rgba(255,40,40,0.65),
        0 0 54px rgba(255,40,40,0.50),
        0 0 120px rgba(255,40,40,0.28);
    }

    .flicker-off {
      opacity: 0.12;
      filter: brightness(0.6);
      text-shadow: none;
    }

    /* optional: ein ganz leichter "Stromimpuls" */
    .flicker-jitter {
      transform: translateY(0.6px);
    }

    @media (prefers-reduced-motion: reduce) {
      .neon { transition: none !important; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="panel" aria-live="polite">
      <div class="content">
        <div id="headline" class="headline neon">SEI BEREIT!</div>

        <div id="lineTop" class="line neon"></div>
        <div id="lineTop" class="line neon"></div>

        <div id="timer" class="timer neon">
          <span id="days" class="days">-- TAGE</span>
          <span id="hms" class="hms">--:--:--</span>
        </div>

        <div id="lineBottom" class="line neon"></div>
        <div id="lineBottom" class="line neon"></div>

        <div id="targetLabel" class="sub neon">10.07.2026 · 14:00</div>
      </div>
    </div>
  </div>

  <script>
    // Countdown Ziel: 10.07.2026, 14:00 (lokale Zeit)
    const targetDate = new Date(2026, 6, 10, 14, 0, 0);

    const daysEl = document.getElementById("days");
    const hmsEl = document.getElementById("hms");
    const targetLabelEl = document.getElementById("targetLabel");

    function pad(n){ return String(n).padStart(2, "0"); }

    function updateTimer(){
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        daysEl.textContent = "0 TAGE";
        hmsEl.textContent = "00:00:00";
        targetLabelEl.textContent = "JETZT.";
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      daysEl.textContent = `${days} TAGE`;
      hmsEl.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    updateTimer();
    setInterval(updateTimer, 250);

    // --- Realistisches Flicker (unregelmäßige Pulse via JS) ---
    const neonEls = [
      document.getElementById("headline"),
      document.getElementById("lineTop"),
      document.getElementById("timer"),
      document.getElementById("lineBottom"),
      document.getElementById("targetLabel"),
    ];

    const states = ["flicker-dim", "flicker-pop", "flicker-off", "flicker-jitter"];
    function clearStates(){
      for (const el of neonEls) el.classList.remove(...states);
    }

    function rand(min, max){ return Math.random() * (max - min) + min; }
    function chance(p){ return Math.random() < p; }

    // Ein "Event" besteht aus mehreren kurzen Impulsen (wie Zündversuche)
    function runFlickerEvent(){
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      // Wie oft Events passieren: eher selten, damit es echt wirkt
      // (Durchschnittlich alle ~2.5–6 Sekunden, plus Zufall)
      const pulses = chance(0.25) ? 5 : chance(0.45) ? 3 : 2; // manchmal mehr Impulse

      let i = 0;
      (function pulse(){
        i++;

        // Art des Impulses bestimmen (meist dim, manchmal off, manchmal pop)
        clearStates();

        // “off” ist selten, aber sorgt für echten Neon-Vibe
        if (chance(0.10)) {
          for (const el of neonEls) el.classList.add("flicker-off");
        } else if (chance(0.25)) {
          for (const el of neonEls) el.classList.add("flicker-pop");
        } else {
          for (const el of neonEls) el.classList.add("flicker-dim");
        }

        // leichter mechanischer Jitter bei einem Teil der Impulse
        if (chance(0.35)) {
          for (const el of neonEls) el.classList.add("flicker-jitter");
        }

        // Impulsdauer sehr kurz (typisch 40–120ms)
        const onDuration = rand(45, 120);

        setTimeout(() => {
          // zurück zum Normalzustand
          clearStates();

          // Wenn noch weitere Pulse in diesem Event folgen:
          if (i < pulses) {
            // kurze Pause zwischen Pulsen (30–140ms)
            const gap = rand(30, 140);
            setTimeout(pulse, gap);
          } else {
            // nächstes Event in unregelmäßigem Abstand
            const nextIn = rand(1800, 5200) + (chance(0.20) ? rand(0, 2500) : 0);
            setTimeout(runFlickerEvent, nextIn);
          }
        }, onDuration);
      })();
    }

    // Start nach kurzer Verzögerung, damit Fonts erst laden können
    setTimeout(runFlickerEvent, 900);
  </script>
</body>
</html>
